# DEVELOPMENT ONLY - runs the app on your own computer with throw-away passwords.
# Do NOT put this on a server. Real customers are set up with deploy/new-company.sh
# (own database, random secrets, HTTPS) - see deploy/README.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant_checker
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # this computer only

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://restaurant:restaurant@db:5432/restaurant_checker?schema=public
      JWT_SECRET: dev-only-secret-never-use-in-production
      NODE_ENV: development   # the image defaults to production, which refuses these throw-away secrets
      PORT: 4000
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  db_data:
