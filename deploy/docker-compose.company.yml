# ONE COMPANY = ONE COPY OF THIS STACK (own database, own secrets, own volume).
# Never started by hand: deploy/new-company.sh sets the variables from the company's .env.
services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: rc_${COMPANY_SLUG}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rc
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [private]            # no published port: the database is reachable only by its own app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc -d rc"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${DB_MEM_LIMIT:-384m}
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  app:
    image: rc-app:${RC_VERSION:-latest}
    container_name: rc_${COMPANY_SLUG}_app
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://rc:${POSTGRES_PASSWORD}@db:5432/rc
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      COMPANY_NAME: ${COMPANY_NAME}
      TRUST_PROXY: "true"
    networks: [private, edge]      # edge = the shared network the HTTPS front door (Caddy) listens on
    mem_limit: ${APP_MEM_LIMIT:-256m}
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  private:
    internal: true                 # no route to the internet
  edge:
    external: true
    name: rc_edge

volumes:
  db_data:
